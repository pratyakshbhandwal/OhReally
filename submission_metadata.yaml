# Redrob Hackathon — Submission Metadata
# Fill in your team details before submitting

team_id: "team_xxx"                          # replace with your registered team ID
team_name: "Team Name Here"                  # replace with your team name
members:
  - name: "Member 1"
    role: "AI/LLM Engineer"
  - name: "Member 2"
    role: "Data Engineer"
  - name: "Member 3"
    role: "ML/Evaluation & Deck"
  - name: "Member 4"
    role: "Full-Stack Engineer"

submission_file: "team_xxx.csv"              # rename to match your team_id

reproduce_command: >
  pip install -r requirements.txt &&
  python rank.py --candidates ./candidates.jsonl --out ./team_xxx.csv

sandbox_url: ""                              # fill in your Streamlit Cloud URL after deploy

compute:
  cpu: true
  gpu: false
  ram_gb: 16
  runtime_seconds_approx: 90

approach_summary: >
  Rule-based weighted scoring system with 5 components: title/career fit (35%),
  skill depth (25%), experience quality (20%), behavioral availability (15%),
  soft fit signals (5%). Includes honeypot detection that penalises title-skill
  mismatch candidates (e.g. HR Managers with AI skills) with a 0.05 multiplier.
  Fully offline, CPU-only, no API calls, no GPU required.

methodology_notes:
  - "Honeypot detection applied before scoring — title-skill mismatch gets 0.05 multiplier"
  - "Services-only companies (TCS, Infosys, Wipro etc.) penalised in title_career component"
  - "Skills scored by proficiency level, endorsement count, and duration_months"
  - "Behavioral availability uses redrob_signals: last_active_date, response_rate, notice_period"
  - "Non-increasing score constraint enforced at output time"

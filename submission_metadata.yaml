methodology_summary: >
  We utilized an offline two-stage Retrieve and Re-rank pipeline.
  Stage 1: ChromaDB with all-MiniLM-L6-v2 embeddings for fast semantic matching.
  Stage 2: A custom local Python ranker that evaluates the candidate's redrob_signals 
  (response rate, github activity) to calculate a final pragmatic behavioral multiplier, 
  combined with a honeypot detector to filter traps and keyword stuffers.

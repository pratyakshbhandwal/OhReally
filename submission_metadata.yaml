# ============================================================================
# Approach summary (optional but recommended)
# ============================================================================
methodology_summary: |
  We engineered an offline, two-stage Retrieve and Re-rank pipeline.
  Stage 1 uses ChromaDB with all-MiniLM-L6-v2 sentence embeddings for blazing-fast semantic candidate retrieval, naturally bypassing simple keyword stuffers. 
  Stage 2 executes a custom local ranker that evaluates behavioral heuristics (extracting `redrob_signals` like response rate and availability) to calculate a pragmatic multiplier. This is combined with our proprietary Trap Detector, which mathematically penalizes impossible skill counts (honeypots), title-chasers, and career timeline mismatches. Factual reasoning strings are procedurally generated without LLMs to completely eliminate hallucinations. The entire 100K dataset runs end-to-end on a local CPU in just a few seconds.

